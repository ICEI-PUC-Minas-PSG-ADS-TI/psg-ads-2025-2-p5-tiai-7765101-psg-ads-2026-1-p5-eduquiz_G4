<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLink | Criar Conta</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="container">
        <div class="hero">
            <h1>EduLink 🎓</h1>
            <h2>Comece sua jornada agora.</h2>
            <p>Junte-se a milhares de alunos e transforme sua forma de estudar com IA.</p>
        </div>

        <div class="auth-card">
            <h2>Criar conta</h2>
            <p class="subtitle">Preencha os dados abaixo para começar.</p>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha forte" required>
            </div>

            <button onclick="cadastrar()" class="btn-primary">Cadastrar</button>

            <div class="footer-links">
                <span>Já tem uma conta?</span>
                <a class="link-auth" href="../login/login.html">Fazer login</a>
            </div>

            <p id="erro"></p>
        </div>
    </div>

    <script type="module" src="cadastro.js"></script>
</body>

</html>
