<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuiz – Lições</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="licao.css">
</head>
<body>

  <header class="topbar">
    <button class="btn-back" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Matérias
    </button>
    <div class="subject-pill">
      <span id="pillEmoji">📚</span>
      <span id="pillNome">Carregando…</span>
    </div>
    <div style="width:90px"></div>
  </header>

  <main class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-left">
        <div class="hero-icon" id="heroIcon">📚</div>
        <div>
          <h1 id="heroNome">…</h1>
          <p id="heroNivel">…</p>
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat">
          <span class="stat-val" id="statPct">0%</span>
          <span class="stat-lbl">Acerto geral</span>
        </div>
        <div class="stat">
          <span class="stat-val" id="statLicoes">0</span>
          <span class="stat-lbl">Lições feitas</span>
        </div>
      </div>
    </div>

    <!-- NOVA LIÇÃO -->
    <section class="section">
      <h2 class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Nova lição
      </h2>
      <p class="section-sub">Escolha um tópico para gerar uma nova lição</p>
      <div class="topicos-grid" id="topicosGrid"></div>
    </section>

    <!-- HISTÓRICO -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Histórico
        </h2>
        <a class="btn-ver-historico" id="btnVerHistorico"
           href="../historico/historico.html"
           style="display:none">
          Ver tudo
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
      <div class="empty-state" id="emptyState">
        Você ainda não fez nenhuma lição.<br>Escolha um tópico acima para começar!
      </div>
      <div class="historico-list" id="historicoList"></div>
    </section>

  </main>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-icon" id="modalIcon">📖</div>
      <h3 id="modalTitle">Nova lição</h3>
      <p class="modal-desc">
        Tópico: <strong id="modalTopico">—</strong> em <strong id="modalMateria">—</strong>
      </p>

      <!-- SELETOR DE QUANTIDADE -->
      <div class="qtd-section">
        <p class="qtd-label-title">Quantas questões?</p>
        <div class="qtd-grid" id="qtdGrid">
          <button class="qtd-btn" data-qtd="1">1</button>
          <button class="qtd-btn" data-qtd="2">2</button>
          <button class="qtd-btn" data-qtd="3">3</button>
          <button class="qtd-btn" data-qtd="4">4</button>
          <button class="qtd-btn active" data-qtd="5">5</button>
          <button class="qtd-btn" data-qtd="6">6</button>
          <button class="qtd-btn" data-qtd="7">7</button>
          <button class="qtd-btn" data-qtd="8">8</button>
          <button class="qtd-btn" data-qtd="9">9</button>
          <button class="qtd-btn" data-qtd="10">10</button>
        </div>
        <p class="qtd-selected-label" id="qtdLabel">5 questões</p>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel"  id="btnCancel">Cancelar</button>
        <button class="btn-confirm" id="btnConfirm">Começar ✨</button>
      </div>
    </div>
  </div>

  <script type="module" src="licao.js"></script>
</body>
</html>
